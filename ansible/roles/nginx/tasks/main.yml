# tasks file for nginx

- name: Install nginx
  apt:
    name: nginx
    state: present

- name: Deploy Nginx site config from template
  template:
    src: bookreview.conf.j2
    dest: /etc/nginx/sites-available/bookreview
    owner: root
    group: root
    mode: '0644'
  notify: Reload nginx

- name: Enable the Nginx site (symlink to sites-enabled)
  file:
    src: /etc/nginx/sites-available/bookreview
    dest: /etc/nginx/sites-enabled/bookreview
    state: link
  notify: Reload nginx

- name: Remove default Nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Ensure nginx service is started and enabled
  service:
    name: nginx
    state: started
    enabled: yes


