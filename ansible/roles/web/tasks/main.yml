---
# tasks file for web

- name: Ensure app directory exists
  ansible.builtin.file:
    path: "{{ book_review_app_dir }}"
    state: directory
    owner: "{{ book_review_app_user }}"
    group: "{{ book_review_app_user }}"
    mode: '0755'
  become: true

- name: Clone bookreview repository
  ansible.builtin.git:
    repo: "{{ book_review_app_repo_url }}"
    dest: "{{ book_review_app_dir }}"
    version: "{{ book_review_app_repo_version }}"
    update: yes
  become: true
  become_user: "{{ book_review_app_user }}"
  notify: Restart bookreview app

- name: Deploy .env from template
  template:
    src: .env.j2
    dest: "{{ book_review_app_dir }}/{{ frontend_files_dir }}/.env"
    owner: root
    group: root
    mode: '0644'
  notify: Restart bookreview app

- name: Install npm dependencies
  ansible.builtin.command: npm install
  args:
    chdir: "{{ book_review_app_dir }}/{{ frontend_files_dir }}"
  become: true
  become_user: "{{ book_review_app_user }}"
  notify: Restart bookreview app

- name: Build frontend for production
  ansible.builtin.command: npm run build
  args:
    chdir: "{{ book_review_app_dir }}/{{ frontend_files_dir }}"
  become: true
  become_user: "{{ book_review_app_user }}"
  notify: Restart bookreview app

- name: Install PM2 globally
  ansible.builtin.npm:
    name: pm2
    global: yes
    state: present
  become: true

- name: Start or restart frontend with PM2
  ansible.builtin.shell: |
    pm2 describe "{{ book_review_pm2_app_name }}" >/dev/null 2>&1 \
      && pm2 restart "{{ book_review_pm2_app_name }}" --update-env \
      || pm2 start npm --name "{{ book_review_pm2_app_name }}" -- start
    pm2 save
  args:
    chdir: "{{ book_review_app_dir }}/{{ frontend_files_dir }}"
  become: true
  become_user: "{{ book_review_app_user }}"
  changed_when: true

- name: Enable PM2 startup on boot
  ansible.builtin.command: "pm2 startup systemd -u {{ book_review_app_user }} --hp /home/{{ book_review_app_user }}"
  become: true
  changed_when: false
